{{ define "main" }}
<section class="writing container">
  <div class="section-header">
    <h1 class="section-title">{{ .Title }}</h1>
  </div>

  <div class="writing-grid">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="essay-card">
        {{ with .Params.images }}
          <img class="essay-image" src="{{ index . 0 | relURL }}" alt="" width="1200" height="630" loading="lazy">
        {{ end }}
        <div class="essay-meta">
          <span>{{ .Date | time.Format ":date_medium" }}</span>
          <span>{{ i18n "reading_time" .ReadingTime }}</span>
        </div>
        <h2 class="essay-title">{{ .Title }}</h2>
        <p class="essay-desc">{{ .Description }}</p>
        <div class="tag-row mt-auto">
          {{ range .Params.tags }}<span class="tag tag-sm">{{ . }}</span>{{ end }}
        </div>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
