<div class="reading-share">
  <span class="reading-share-label">{{ i18n "sharePost" }}</span>
  <div class="reading-share-actions">
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="{{ i18n "reading_share_linkedin" }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/><circle cx="8" cy="7.5" r="1.3" fill="#fff"/><path fill="#fff" d="M7 10h2v8H7zM11 10h2v1c1-1.7 5-1.8 5 2v5h-2v-4.6c0-2-3-2-3 0V18h-2z"/></svg></a>
    <a href="https://twitter.com/intent/tweet?url={{ .Permalink | urlquery }}&amp;text={{ .Title | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="{{ i18n "reading_share_x" }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 3h5l5 7 6-7h2l-7 9 7 9h-5l-5-7-6 7H3l7-9L3 3Zm3 2 11 14h2L8 5H6Z"/></svg></a>
    <button type="button" data-copy-link data-url="{{ .Permalink }}" data-label="{{ i18n "copyLink" }}" data-copied-label="{{ i18n "copied" }}" data-failed-label="{{ i18n "code_copy_failed" }}" aria-label="{{ i18n "copyLink" }}" title="{{ i18n "copyLink" }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="8" width="11" height="12" rx="2"/><path d="M9 8V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg></button>
    <span class="reading-copy-feedback" data-copy-feedback role="status" aria-live="polite"></span>
  </div>
</div>
